name: Build Narge List

on:
  push:
    branches: ["main"]
    paths:
      - 'overlay/**'
      - 'core/**'
      - 'scripts/**'
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run one-shot StevenBlack seed (use once only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies (for seed only)
        if: ${{ github.event.inputs.run_seed == 'true' }}
        run: pip install publicsuffix2
      
      - name: Run StevenBlack seed (one-shot)
        if: ${{ github.event.inputs.run_seed == 'true' }}
        run: python3 scripts/seed_from_stevenblack.py
      
      - name: Build Narge list
        run: python3 scripts/build_narge_list.py
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code dist/ || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if [ "${{ github.event.inputs.run_seed }}" == "true" ]; then
            git add core/ candidates/
            git commit -m "Build Narge list (including seed)"
          else
            git commit -m "Build Narge list"
          fi
          git push
