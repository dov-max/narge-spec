name: Build Cutline DNS Installer

on:
  push:
    branches:
      - main
    paths:
      - 'cutline-dns-installer/**'
      - '.github/workflows/build-windows-installer.yml'
  pull_request:
    paths:
      - 'cutline-dns-installer/**'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        working-directory: cutline-dns-installer
        run: dotnet restore
      
      - name: Build and publish
        working-directory: cutline-dns-installer
        run: |
          dotnet publish -c Release -r win-x64 --self-contained -o output
          ls -lh output/
      
      - name: Copy executable to cutline-site/public
        run: |
          mkdir -p cutline-site/public
          cp cutline-dns-installer/output/cutline-dns-setup.exe cutline-site/public/
          ls -lh cutline-site/public/cutline-dns-setup.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-dns-setup
          path: cutline-site/public/cutline-dns-setup.exe
          if-no-files-found: error
      
      - name: Commit executable to repository (on main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cutline-site/public/cutline-dns-setup.exe
          git diff --staged --quiet || git commit -m "Build: Update cutline-dns-setup.exe"
          git push
