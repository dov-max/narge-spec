name: Build Cutline DNS Installer

on:
  push:
    branches:
      - main
    paths:
      - 'cutline-dns-installer/**'
      - '.github/workflows/build-windows-installer.yml'
  pull_request:
    paths:
      - 'cutline-dns-installer/**'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: windows-latest
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'cutline-sign' || '' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        working-directory: cutline-dns-installer
        run: dotnet restore
      
      - name: Build and publish
        working-directory: cutline-dns-installer
        run: |
          dotnet publish -c Release -r win-x64 --self-contained -o output
          dir output
        shell: pwsh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-dns-setup
          path: cutline-dns-installer/output/cutline-dns-setup.exe
          if-no-files-found: error
      
      - name: Azure Login with OIDC (optional)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Sign with Azure Artifact Signing (optional)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          code-signing-account-name: cutlinesign
          certificate-profile-name: cutline
          files-folder: ${{ github.workspace }}/cutline-dns-installer/output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      
      - name: Verify signed exe (optional)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.AZURE_CLIENT_ID != ''
        run: |
          $sig = Get-AuthenticodeSignature cutline-dns-installer/output/cutline-dns-setup.exe
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -eq "Valid") {
            Write-Host "✓ Authenticode signature is valid!"
            Write-Host "  Subject: $($sig.SignerCertificate.Subject)"
            Write-Host "  Issuer: $($sig.SignerCertificate.Issuer)"
            Write-Host "  Thumbprint: $($sig.SignerCertificate.Thumbprint)"
          } else {
            Write-Warning "Signature status: $($sig.Status)"
          }
        shell: pwsh
      
      - name: Create or update GitHub Release (on main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $RELEASE_TAG = "cutline-dns-v1.1.0"
          $RELEASE_NAME = "Cutline DNS Installer v1.1.0"
          
          # Check if release exists
          gh release view $RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $RELEASE_TAG already exists, deleting asset if present..."
            gh release delete-asset $RELEASE_TAG cutline-dns-setup.exe --yes 2>$null
          } else {
            Write-Host "Creating new release $RELEASE_TAG..."
            gh release create $RELEASE_TAG `
              --title $RELEASE_NAME `
              --notes "Windows installer for Cutline DNS with encrypted DNS support (DoH). Self-contained WinForms wizard with /silent and /uninstall support."
          }
          
          Write-Host "Uploading cutline-dns-setup.exe to release..."
          gh release upload $RELEASE_TAG cutline-dns-installer/output/cutline-dns-setup.exe --clobber
        shell: pwsh
