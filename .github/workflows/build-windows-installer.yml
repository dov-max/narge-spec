name: Build Cutline DNS Installer

on:
  push:
    branches:
      - main
    paths:
      - 'cutline-dns-installer/**'
      - '.github/workflows/build-windows-installer.yml'
  pull_request:
    paths:
      - 'cutline-dns-installer/**'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        working-directory: cutline-dns-installer
        run: dotnet restore
      
      - name: Build and publish
        working-directory: cutline-dns-installer
        run: |
          dotnet publish -c Release -r win-x64 --self-contained -o output
          dir output
        shell: pwsh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-dns-setup
          path: cutline-dns-installer/output/cutline-dns-setup.exe
          if-no-files-found: error
