name: Build and Submit to App Store (iOS + macOS + visionOS)

on:
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: macos-26
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify build environment and Xcode
        run: |
          sw_vers
          echo "---"
          sw_vers -buildVersion
          echo "---"
          xcodebuild -version
          echo "---"
          xcode-select -p
          echo "---"
          xcodebuild -showsdks
      
      - name: Import iOS distribution certificate
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain.pass"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/ios_cert.p12
          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
          
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      
      - name: Import Mac installer certificate
        env:
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(cat "$RUNNER_TEMP/keychain.pass")
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          CERT_PATH=$RUNNER_TEMP/mac_installer.p12
          echo "$MAC_INSTALLER_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$MAC_INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$CERT_PATH"
      
      - name: Import iOS provisioning profile
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/ios_profile.mobileprovision
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          
          PP_UUID=$(grep -a -A1 UUID "$PROFILE_PATH" | tail -1 | sed 's/[^a-zA-Z0-9-]//g')
          cp "$PROFILE_PATH" "$PP_DIR/$PP_UUID.mobileprovision"
          
          echo "Installed iOS/visionOS profile: $PP_UUID"
          rm "$PROFILE_PATH"
      
      - name: Import macOS provisioning profile
        env:
          MAC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/mac_profile.provisionprofile
          echo "$MAC_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          
          PP_UUID=$(grep -a -A1 UUID "$PROFILE_PATH" | tail -1 | sed 's/[^a-zA-Z0-9-]//g')
          cp "$PROFILE_PATH" "$PP_DIR/$PP_UUID.provisionprofile"
          
          echo "Installed macOS profile: $PP_UUID"
          rm "$PROFILE_PATH"
      
      - name: Build and archive iOS
        run: |
          cd cutline-dns-app
          
          xcodebuild archive \
            -project CutlineDNS.xcodeproj \
            -scheme CutlineDNS \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CutlineDNS-iOS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=H4R564J4LK \
            PROVISIONING_PROFILE_SPECIFIER="Cutline DNS App Store CI" \
            CODE_SIGN_IDENTITY="Apple Distribution: Optivantage Solutions LLC (H4R564J4LK)" \
            PRODUCT_BUNDLE_IDENTIFIER=org.thecutline.dns \
            -allowProvisioningUpdates
      
      - name: Build and archive macOS
        run: |
          cd cutline-dns-app
          
          xcodebuild archive \
            -project CutlineDNS.xcodeproj \
            -scheme CutlineDNS \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/CutlineDNS-macOS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=H4R564J4LK \
            PROVISIONING_PROFILE_SPECIFIER="Cutline DNS Mac App Store CI" \
            CODE_SIGN_IDENTITY="Apple Distribution: Optivantage Solutions LLC (H4R564J4LK)" \
            PRODUCT_BUNDLE_IDENTIFIER=org.thecutline.dns \
            -allowProvisioningUpdates
      
      - name: Build and archive visionOS
        run: |
          cd cutline-dns-app
          
          xcodebuild archive \
            -project CutlineDNS.xcodeproj \
            -scheme CutlineDNS \
            -destination "generic/platform=visionOS" \
            -archivePath "$RUNNER_TEMP/CutlineDNS-visionOS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=H4R564J4LK \
            PROVISIONING_PROFILE_SPECIFIER="Cutline DNS App Store CI" \
            CODE_SIGN_IDENTITY="Apple Distribution: Optivantage Solutions LLC (H4R564J4LK)" \
            PRODUCT_BUNDLE_IDENTIFIER=org.thecutline.dns \
            -allowProvisioningUpdates
      
      - name: Export iOS IPA
        run: |
          cd cutline-dns-app
          
          cat > "$RUNNER_TEMP/ExportOptions-iOS.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>H4R564J4LK</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>org.thecutline.dns</key>
                  <string>Cutline DNS App Store CI</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CutlineDNS-iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-ios" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-iOS.plist" \
            -allowProvisioningUpdates
          
          ls -lh "$RUNNER_TEMP/export-ios/"
      
      - name: Export macOS PKG
        run: |
          cd cutline-dns-app
          
          cat > "$RUNNER_TEMP/ExportOptions-macOS.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>H4R564J4LK</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>org.thecutline.dns</key>
                  <string>Cutline DNS Mac App Store CI</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>installerSigningCertificate</key>
              <string>3rd Party Mac Developer Installer</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CutlineDNS-macOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-macos" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-macOS.plist" \
            -allowProvisioningUpdates
          
          ls -lh "$RUNNER_TEMP/export-macos/"
      
      - name: Export visionOS IPA
        run: |
          cd cutline-dns-app
          
          cat > "$RUNNER_TEMP/ExportOptions-visionOS.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>H4R564J4LK</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>org.thecutline.dns</key>
                  <string>Cutline DNS App Store CI</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CutlineDNS-visionOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-visionos" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-visionOS.plist" \
            -allowProvisioningUpdates
          
          ls -lh "$RUNNER_TEMP/export-visionos/"
      
      - name: Upload iOS to App Store Connect
        if: always()
        id: upload-ios
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export-ios/CutlineDNS.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          
          echo "iOS uploaded to App Store Connect"
          rm "$API_KEY_PATH"
      
      - name: Upload macOS to App Store Connect
        if: always()
        id: upload-macos
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          
          # Find the exported pkg file
          PKG_FILE=$(ls "$RUNNER_TEMP/export-macos/"*.pkg | head -1)
          if [ -z "$PKG_FILE" ]; then
            echo "Error: No .pkg file found in export directory"
            ls -lh "$RUNNER_TEMP/export-macos/"
            exit 1
          fi
          
          xcrun altool --upload-app \
            --type osx \
            --file "$PKG_FILE" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          
          echo "macOS uploaded to App Store Connect"
          rm "$API_KEY_PATH"
      
      - name: Upload visionOS to App Store Connect
        if: always()
        id: upload-visionos
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          
          xcrun altool --upload-app \
            --type visionos \
            --file "$RUNNER_TEMP/export-visionos/CutlineDNS.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          
          echo "visionOS uploaded to App Store Connect"
          rm "$API_KEY_PATH"
      
      - name: Check upload results
        if: always()
        run: |
          FAILED=0
          
          if [ "${{ steps.upload-ios.outcome }}" != "success" ]; then
            echo "❌ iOS upload failed"
            FAILED=1
          else
            echo "✅ iOS upload succeeded"
          fi
          
          if [ "${{ steps.upload-macos.outcome }}" != "success" ]; then
            echo "❌ macOS upload failed"
            FAILED=1
          else
            echo "✅ macOS upload succeeded"
          fi
          
          if [ "${{ steps.upload-visionos.outcome }}" != "success" ]; then
            echo "❌ visionOS upload failed"
            FAILED=1
          else
            echo "✅ visionOS upload succeeded"
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo "One or more uploads failed"
            exit 1
          fi
          
          echo "All uploads succeeded"
      
      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
