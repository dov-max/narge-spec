# Nginx config snippet for serving stats.json with CORS
# Include this in your nginx server blocks for ewr.dns.thecutline.org and lax.dns.thecutline.org
#
# DNS Records Required:
#   ewr.dns.thecutline.org → 64.176.200.99 (EWR VM)
#   lax.dns.thecutline.org → 149.28.79.49 (LAX VM)

location /stats.json {
    alias /var/cutline/stats/stats.json;
    
    # CORS headers to allow thecutline.org to fetch
    add_header Access-Control-Allow-Origin "https://thecutline.org" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    
    # Cache for 30 seconds
    add_header Cache-Control "public, max-age=30" always;
    
    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }
    
    default_type application/json;
}

location /history.jsonl {
    alias /var/cutline/stats/history.jsonl;
    
    # CORS headers
    add_header Access-Control-Allow-Origin "https://thecutline.org" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    
    # Cache for 1 hour (history changes daily)
    add_header Cache-Control "public, max-age=3600" always;
    
    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }
    
    default_type application/x-ndjson;
}
