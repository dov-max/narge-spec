# Blocky DNS resolver configuration for Narge
# This config loads the Narge production list
# plus local overlay corrections.

upstreams:
  groups:
    default:
      - 1.1.1.1
      - 1.0.0.1

blocking:
  blockType: nxDomain
  
  denylists:
    narge:
      # Narge production list
      - https://raw.githubusercontent.com/dov-max/narge-spec/main/dist/narge.txt
      # GitHub overlay: extra hosts to block
      - https://raw.githubusercontent.com/dov-max/narge-spec/main/overlay/block.txt
  
  allowlists:
    narge:
      # GitHub overlay: exceptions (takes precedence over denylist)
      - https://raw.githubusercontent.com/dov-max/narge-spec/main/overlay/allow.txt
  
  clientGroupsBlock:
    default:
      - narge
  
  loading:
    refreshPeriod: 24h
    strategy: blocking

# DNS port 53 only
ports:
  dns: 53
  http: 4000

# Prometheus metrics for stats collection
prometheus:
  enable: true
  path: /metrics

# No query logging by name
# queryLog section is omitted to disable query logging
