# Blocky DNS resolver configuration for Narge
# This config loads the Narge production list
# plus local overlay corrections.

upstreams:
  groups:
    default:
      - 1.1.1.1
      - 1.0.0.1

blocking:
  blockType: nxDomain
  
  denylists:
    narge:
      # Narge production list (includes all sources)
      - https://raw.githubusercontent.com/dov-max/narge-spec/main/dist/narge.txt
    canaries:
      # Local test domains
      - |
        off.thecutline.org
  
  clientGroupsBlock:
    default:
      - narge
      - canaries
  
  loading:
    refreshPeriod: 24h
    strategy: blocking

# DNS port 53 only
ports:
  dns: 53

# No query logging by name
# queryLog section is omitted to disable query logging
