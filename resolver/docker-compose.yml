version: '3.8'

services:
  blocky:
    image: ghcr.io/0xerr0r/blocky
    # Alternative image: spx01/blocky
    container_name: blocky-narge
    restart: unless-stopped
    volumes:
      - ../resolver/config.yml:/app/config.yml:ro
      - ../overlay:/overlay:ro
    # Ports are commented out by default - uncomment when deploying on VPS
    # ports:
    #   - "53:53/udp"
    #   - "53:53/tcp"
    # Optional: add capability to bind to port 53 without running as root
    # cap_add:
    #   - NET_BIND_SERVICE
